name: Deploy site

# Auto-deploys the marketing site to Cloudflare. Triggers on web/ changes and on
# the two rumor/ sources the site mirrors at build time: the version (Cargo.toml)
# and the agent docs (AGENTS_GUIDE.md). A release bumps Cargo.toml, so the site
# redeploys with the new version automatically; editing the guide redeploys /docs.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - "rumor/Cargo.toml"
      - "rumor/docs/AGENTS_GUIDE.md"
  workflow_dispatch: {} # allow a manual run from the Actions tab if ever needed

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # Pin to v4: the wrangler.jsonc is an assets-only Worker (no `main`),
          # which the action's default wrangler 3.90.0 doesn't support and fails
          # with "Missing entry-point".
          wranglerVersion: "4"
          command: deploy
