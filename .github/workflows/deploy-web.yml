name: Deploy site

# Auto-deploys the marketing site to Cloudflare, but ONLY when something under
# web/ (or this workflow) changes — a Rust-only commit to rumor/ won't trigger it.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {} # allow a manual run from the Actions tab if ever needed

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # Pin to v4: the wrangler.jsonc is an assets-only Worker (no `main`),
          # which the action's default wrangler 3.90.0 doesn't support and fails
          # with "Missing entry-point".
          wranglerVersion: "4"
          command: deploy
