[package]
name = "rumor"
version = "0.1.0"
edition = "2021"
description = "Multi-process TUI orchestrator"
license = "MIT"
repository = "https://github.com/ornitech/rumor"
homepage = "https://github.com/ornitech/rumor"
readme = "README.md"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-term = "0.3"
vt100 = "0.16"
portable-pty = "0.9"
libc = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "signal", "fs", "net"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
regex = "1"

anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
